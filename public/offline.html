<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're offline — Mom's Dragonfly</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #061416;
      color: #f0f4f8;
      padding: 1.5rem;
      text-align: center;
    }
    .icon { width: 80px; height: 80px; margin-bottom: 1rem; }
    .icon svg { width: 100%; height: 100%; }
    h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 0.5rem; color: #319795; }
    p { font-size: 0.95rem; color: #829ab1; max-width: 320px; line-height: 1.5; margin: 0 0 1.5rem; }
    button {
      padding: 0.85rem 2rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, #06b6d4 0%, #319795 50%, #10b981 100%);
      color: #061416;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      min-height: 48px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#319795" />
          <stop offset="50%" stop-color="#2c7a7b" />
          <stop offset="100%" stop-color="#285e61" />
        </linearGradient>
        <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.4" />
          <stop offset="50%" stop-color="#38b2ac" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
        </linearGradient>
        <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef3c7" />
          <stop offset="100%" stop-color="#fcd34d" />
        </linearGradient>
      </defs>

      <ellipse cx="32" cy="48" rx="2" ry="3" fill="url(#bodyGrad)" />
      <ellipse cx="32" cy="42" rx="2.5" ry="3" fill="url(#bodyGrad)" />
      <ellipse cx="32" cy="36" rx="3" ry="3" fill="url(#bodyGrad)" />
      <ellipse cx="32" cy="28" rx="4" ry="4" fill="url(#bodyGrad)" />
      <ellipse cx="32" cy="20" rx="3.5" ry="3.5" fill="url(#bodyGrad)" />

      <ellipse cx="28" cy="18" rx="1.5" ry="1.5" fill="url(#eyeGrad)" />
      <ellipse cx="36" cy="18" rx="1.5" ry="1.5" fill="url(#eyeGrad)" />
      <ellipse cx="28" cy="18" rx="0.75" ry="0.75" fill="#102a43" />
      <ellipse cx="36" cy="18" rx="0.75" ry="0.75" fill="#102a43" />

      <g class="wing-animate">
        <ellipse cx="12" cy="24" rx="8" ry="6" fill="url(#wingGrad)"
          transform="rotate(-25 12 24)" stroke="#285e61" stroke-width="0.2" stroke-opacity="0.4" />
        <ellipse cx="52" cy="24" rx="8" ry="6" fill="url(#wingGrad)"
          transform="rotate(25 52 24)" stroke="#285e61" stroke-width="0.2" stroke-opacity="0.4" />
      </g>

      <g class="wing-animate" style="animation-delay: 0.3s;">
        <ellipse cx="16" cy="34" rx="6" ry="4.5" fill="url(#wingGrad)"
          transform="rotate(-35 16 34)" stroke="#285e61" stroke-width="0.2" stroke-opacity="0.4" />
        <ellipse cx="48" cy="34" rx="6" ry="4.5" fill="url(#wingGrad)"
          transform="rotate(35 48 34)" stroke="#285e61" stroke-width="0.2" stroke-opacity="0.4" />
      </g>

      <g stroke="#102a43" stroke-width="0.5" fill="none" opacity="0.6">
        <line x1="26" y1="30" x2="20" y2="38" />
        <line x1="38" y1="30" x2="44" y2="38" />
        <line x1="25" y1="34" x2="22" y2="42" />
        <line x1="39" y1="34" x2="42" y2="42" />
      </g>

      <g stroke="#102a43" stroke-width="0.4" fill="none" stroke-linecap="round" opacity="0.6">
        <path d="M30 16 Q26 10 28 6" />
        <path d="M34 16 Q38 10 36 6" />
      </g>

      <style>
        .wing-animate {
          animation: wing-shimmer 2s ease-in-out infinite;
        }
        @keyframes wing-shimmer {
          0%, 100% { opacity: 0.3; }
          50% { opacity: 0.6; }
        }
        @media (prefers-reduced-motion: reduce) {
          .wing-animate {
            animation: none;
            opacity: 0.45;
          }
        }
      </style>
    </svg>
  </div>
  <h1>You are currently offline</h1>
  <p>Your saved maps, expenses, reminders, and tickets are cached safely on this device.</p>
  <button onclick="window.location.reload()">Refresh Connection</button>
</body>
</html>
