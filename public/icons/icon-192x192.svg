<svg width="192" height="192" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#15803d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#166534;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#16a34a;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde047;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Body segments -->
  <g transform="translate(96, 96)">
    <!-- Tail segments (abdomen) -->
    <ellipse cx="0" cy="80" rx="5.25" ry="7.5" fill="url(#bodyGradient)" />
    <ellipse cx="0" cy="55" rx="6" ry="7.5" fill="url(#bodyGradient)" />
    <ellipse cx="0" cy="30" rx="6.75" ry="7.5" fill="url(#bodyGradient)" />
    
    <!-- Thorax -->
    <ellipse cx="0" cy="0" rx="8.25" ry="9.375" fill="url(#bodyGradient)" />
    
    <!-- Head -->
    <ellipse cx="0" cy="-30" rx="7.5" ry="7.5" fill="url(#bodyGradient)" />
    
    <!-- Eyes -->
    <ellipse cx="-12" cy="-35" rx="3" ry="3" fill="url(#eyeGradient)" />
    <ellipse cx="12" cy="-35" rx="3" ry="3" fill="url(#eyeGradient)" />
    <ellipse cx="-12" cy="-35" rx="1.5" ry="1.5" fill="#166534" />
    <ellipse cx="12" cy="-35" rx="1.5" ry="1.5" fill="#166534" />
    
    <!-- Wings - front pair -->
    <ellipse cx="-55" cy="-15" rx="16.875" ry="13.125" fill="url(#wingGradient)" transform="rotate(-25)" stroke="#15803d" stroke-width="0.375" stroke-opacity="0.3"/>
    <ellipse cx="55" cy="-15" rx="16.875" ry="13.125" fill="url(#wingGradient)" transform="rotate(25)" stroke="#15803d" stroke-width="0.375" stroke-opacity="0.3"/>
    
    <!-- Wing veins -->
    <g stroke="#15803d" stroke-width="0.1875" stroke-opacity="0.4" fill="none">
      <line x1="0" y1="-15" x2="-55" y2="-50" transform="rotate(-25)" />
      <line x1="0" y1="-15" x2="-55" y2="-5" transform="rotate(-25)" />
      <line x1="0" y1="-15" x2="-80" y2="-25" transform="rotate(-25)" />
      <line x1="0" y1="-15" x2="55" y2="-50" transform="rotate(25)" />
      <line x1="0" y1="-15" x2="55" y2="-5" transform="rotate(25)" />
      <line x1="0" y1="-15" x2="80" y2="-25" transform="rotate(25)" />
    </g>
    
    <!-- Wings - rear pair -->
    <ellipse cx="-45" cy="25" rx="13.125" ry="9.375" fill="url(#wingGradient)" transform="rotate(-35)" stroke="#15803d" stroke-width="0.375" stroke-opacity="0.3"/>
    <ellipse cx="45" cy="25" rx="13.125" ry="9.375" fill="url(#wingGradient)" transform="rotate(35)" stroke="#15803d" stroke-width="0.375" stroke-opacity="0.3"/>
    
    <g stroke="#15803d" stroke-width="0.1875" stroke-opacity="0.4" fill="none">
      <line x1="0" y1="25" x2="-45" y2="0" transform="rotate(-35)" />
      <line x1="0" y1="25" x2="-45" y2="45" transform="rotate(-35)" />
      <line x1="0" y1="25" x2="-65" y2="20" transform="rotate(-35)" />
      <line x1="0" y1="25" x2="45" y2="0" transform="rotate(35)" />
      <line x1="0" y1="25" x2="45" y2="45" transform="rotate(35)" />
      <line x1="0" y1="25" x2="65" y2="20" transform="rotate(35)" />
    </g>
    
    <!-- Legs -->
    <g stroke="#166534" stroke-width="0.75" fill="none">
      <line x1="-20" y1="10" x2="-35" y2="25" />
      <line x1="20" y1="10" x2="35" y2="25" />
      <line x1="-18" y1="25" x2="-30" y2="40" />
      <line x1="18" y1="25" x2="30" y2="40" />
      <line x1="-15" y1="40" x2="-25" y2="55" />
      <line x1="15" y1="40" x2="25" y2="55" />
    </g>
    
    <!-- Antennae -->
    <g stroke="#166534" stroke-width="0.5625" fill="none" stroke-linecap="round">
      <path d="M-10 -50 Q-20 -65 -15 -75" />
      <path d="M10 -50 Q20 -65 15 -75" />
    </g>
  </g>
</svg>